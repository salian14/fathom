apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fathom-mcp.fullname" . }}
  namespace: {{ include "fathom-mcp.namespace" . }}
  labels:
    {{- include "fathom-mcp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "fathom-mcp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fathom-mcp.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- /*
          Every values block the container reads through env belongs here, or a
          change to it edits the Deployment without restarting the pod that is
          meant to pick it up. server, limits and otel were all missing.
        */}}
        checksum/config: {{ printf "%s%s%s%s" (toYaml .Values.k8s) (toYaml .Values.server) (toYaml .Values.limits) (toYaml .Values.otel) | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "fathom-mcp.serviceAccountName" . }}
      automountServiceAccountToken: true
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: fathom-mcp
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: FATHOM_MCP_TRANSPORT
              value: {{ .Values.server.transport | quote }}
            - name: FATHOM_MCP_ADDR
              value: ":{{ .Values.service.port }}"
            - name: FATHOM_MCP_MCP_PATH
              value: {{ .Values.server.path | quote }}
            - name: FATHOM_MCP_LOG_LEVEL
              value: {{ .Values.server.logLevel | quote }}
            - name: FATHOM_MCP_ALLOWED_RESOURCES
              value: {{ join "," .Values.k8s.allowedResources | quote }}
            - name: FATHOM_MCP_ALLOWED_NAMESPACES
              value: {{ join "," .Values.k8s.allowedNamespaces | quote }}
            - name: FATHOM_MCP_DEFAULT_NAMESPACE
              value: {{ .Values.k8s.defaultNamespace | quote }}
            - name: FATHOM_MCP_MAX_BYTES
              value: {{ .Values.limits.maxBytes | quote }}
            - name: FATHOM_MCP_LIST_LIMIT
              value: {{ .Values.limits.listLimit | quote }}
            - name: FATHOM_MCP_LOG_TAIL_LINES
              value: {{ .Values.limits.logTailLines | quote }}
            - name: FATHOM_MCP_LOG_MAX_TAIL_LINES
              value: {{ .Values.limits.logMaxTailLines | quote }}
            - name: FATHOM_MCP_LOG_MAX_BYTES
              value: {{ .Values.limits.logMaxBytes | quote }}
            - name: FATHOM_MCP_REQUEST_TIMEOUT
              value: {{ .Values.limits.requestTimeout | quote }}
            {{- /*
              Declared before OTEL_RESOURCE_ATTRIBUTES because the kubelet only
              expands $(VAR) references to variables defined earlier in this
              list. The downward API is used rather than an API-server lookup so
              the same block works in the agent chart, whose pod has no RBAC.
            */}}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: FATHOM_MCP_TELEMETRY
              value: {{ .Values.otel.mode | quote }}
            {{- if ne .Values.otel.mode "off" }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"
            - name: OTEL_TRACES_SAMPLER
              value: {{ .Values.otel.sampler | quote }}
            - name: OTEL_METRIC_EXPORT_INTERVAL
              value: {{ .Values.otel.metricExportInterval | quote }}
            - name: OTEL_PROPAGATORS
              value: "tracecontext,baggage"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "k8s.namespace.name=$(POD_NAMESPACE),k8s.pod.name=$(POD_NAME),k8s.node.name=$(NODE_NAME),k8s.deployment.name={{ include "fathom-mcp.fullname" . }},service.instance.id=$(POD_NAME),deployment.environment.name={{ .Values.otel.environment }}"
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
