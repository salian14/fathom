apiVersion: v1
kind: Service
metadata:
  name: {{ include "fathom-front.fullname" . }}
  namespace: {{ include "fathom-front.namespace" . }}
  labels:
    {{- include "fathom-front.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
      {{- if and (ne .Values.service.type "ClusterIP") .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
  selector:
    {{- include "fathom-front.selectorLabels" . | nindent 4 }}
