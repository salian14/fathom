[project]
name = "fathom-agent"
version = "0.5.1"
description = "Fathom's agent: drives an Ollama model against the read-only Kubernetes tools exposed by fathom-mcp."
requires-python = ">=3.12"

dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.3",
    "langgraph==1.2.11",
    "langchain-core==1.5.5",
    "langchain-ollama==1.1.0",
    "langchain-mcp-adapters==0.3.2",
    "httpx==0.28.1",
    # Telemetry. The gRPC exporter is installed directly rather than through the
    # opentelemetry-exporter-otlp meta-package, which would also drag in the HTTP
    # exporter and requests for no benefit.
    #
    # Core (1.x) and contrib (0.x) version lines advance together: keep them in
    # step when bumping, or the instrumentations will not find the API they pin.
    "opentelemetry-sdk==1.44.0",
    "opentelemetry-exporter-otlp-proto-grpc==1.44.0",
    "opentelemetry-instrumentation-fastapi==0.65b0",
    "opentelemetry-instrumentation-httpx==0.65b0",
    "opentelemetry-instrumentation-logging==0.65b0",
    "opentelemetry-instrumentation-system-metrics==0.65b0",
    "openinference-instrumentation-langchain==0.1.70",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.1",
    "pytest-asyncio==1.3.0",
    "ruff==0.15.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# E/F pyflakes+pycodestyle, I import sorting, UP pyupgrade, B bugbear.
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
