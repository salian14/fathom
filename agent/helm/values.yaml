namespace:
  name: fathom
  # False: Argo CD creates the namespace (CreateNamespace=true on the Applications
  # in deploy/applications.yaml). No chart renders it.
  create: false

replicaCount: 1
image:
  # Public, because the lab contract (5.3) has tenants pull from outside the lab:
  # an image that lives there survives a lab rebuild. The tag stays empty so the
  # chart's appVersion pins it -- a version bump committed to git is the deploy.
  repository: ghcr.io/salian14/fathom-agent
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  # ClusterIP: the lab contract (6.3) has tenants use the shared gateway rather
  # than NodePorts, and the only caller that needs the agent is fathom-front, in
  # this namespace. From the workstation, port-forward:
  #   kubectl --context spellcore-k8s-lab -n fathom port-forward svc/fathom-agent 8081:8080
  type: ClusterIP
  port: 8080
  # Only read when type is NodePort (or LoadBalancer), which the lab needs
  # approval for. Null lets the API server assign one.
  nodePort: null

serviceAccount:
  create: true
  name: ""
  annotations: {}

mcp:
  url: http://fathom-mcp.fathom.svc.cluster.local:8080/mcp

ollama:
  # The host's address on the node network, dialled directly -- no DNS involved.
  # This is OLLAMA_URL as printed by ollama/setup.sh; ollama/config.env is the
  # source of truth for it, so change it there and re-run setup, then copy here.
  #
  # Not a Service name on purpose: resolving one would mean teaching CoreDNS about
  # .lab, and the cluster's DNS config is deliberately left stock. See the README.
  url: http://192.168.56.1:11434
  # The alias created by ollama/setup.sh, never the base model tag.
  model: fathom-agent
  service:
    # The ExternalName Service is off. It renders correctly but does not resolve on
    # this cluster, and making it resolve requires a CoreDNS change we do not want.
    create: false
    name: fathom-ollama
    externalName: localllm.lab

agent:
  logLevel: info
  maxIterations: 8
  maxToolChars: 8000
  requestTimeout: 180s
  mcpTimeout: 30s
  readyCache: 30s
  # Empty means the prompt compiled into the image. Note that overriding it replaces
  # the prompt wholesale, including the instruction to lead with a remediation -- an
  # override written before that existed will score badly on fathom-eval's
  # remediation checks for a reason that is configuration, not the model.
  systemPrompt: ""

  remediation:
    # The second, tool-free model call that shapes the finished answer into the
    # structured `remediation` object on the /chat response. Off is supported and
    # simply omits the field; the prose answer is unchanged either way.
    enabled: true
    # Budget for that call alone, inside requestTimeout above. Deliberately well
    # below it: the diagnosis is already in hand by the time shaping starts, so a
    # slow shaper should cost the fix, never the answer.
    timeout: 45s

otel:
  # otlp | console | off.
  #
  # "console" writes spans to stderr and needs no collector, which is what makes
  # `make run-local` usable. "off" still installs the context propagator and the
  # trace ids in logs, so a disabled agent does not break the trace for fathom-mcp.
  mode: otlp
  # The collector lives in another namespace, so this has to be an FQDN. The
  # http:// scheme selects plaintext gRPC; there is no TLS in the lab.
  endpoint: http://otel-collector.observability.svc.cluster.local:4317
  # Probes are excluded before sampling, so this only samples real work, and
  # parentbased means a child never disagrees with its parent.
  sampler: parentbased_always_on
  # Milliseconds. 60s keeps the metric stream cheap on a 3-VM lab cluster.
  metricExportInterval: 60000
  # Becomes deployment.environment.name on every span and metric.
  environment: lab

extraEnv: []

resources:
  requests:
    cpu: 100m
    # Raised from 256Mi alongside the limit: grpcio is a native extension with
    # its own threads, and the batch span processor holds a queue, so baseline
    # RSS is ~60-90Mi higher than before. Leaving the request low while the
    # limit rose would just make this pod a better eviction candidate.
    memory: 384Mi
  limits:
    # The README already lists OOMKilled as a known failure here, and the OTel
    # SDK lands on top of an import tree that was most of the baseline.
    memory: 1536Mi

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
