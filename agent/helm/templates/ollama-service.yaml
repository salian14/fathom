{{- if .Values.ollama.service.create }}
{{/*
OFF BY DEFAULT (ollama.service.create=false). The agent dials ollama.url, which
carries the host's IP directly. This template is kept, unrendered, because the idea
is sound and only fails for a reason specific to this cluster -- documented below so
it is not rediscovered from scratch.

Ollama runs on the host, outside the cluster, so there is no Deployment to select
and no Endpoints to populate from one. ExternalName makes the host reachable under
a normal in-cluster DNS name: a pod resolving fathom-ollama.fathom.svc.cluster.local
gets a CNAME to ollama.service.externalName, which CoreDNS then has to resolve
through its upstream forwarder.

That last step is what does not work here, and an earlier version of this comment got
it wrong. It claimed CoreDNS's upstream is libvirt's dnsmasq, so a host /etc/hosts
entry alone would reach pods. It does not. CoreDNS forwards to the node's
/run/systemd/resolve/resolv.conf, which points at a public resolver, so .lab comes
back NXDOMAIN. registry.lab looks like a counter-example but is not: it lives in each
VM's own /etc/hosts and is resolved by kubelet, and CoreDNS never reads a node's hosts
file. A pod then gets a CNAME with no A record behind it, surfacing as EAI_NONAME
("Name or service not known").

Making it resolve would mean adding a .lab stub zone to the coredns ConfigMap. That
was considered and rejected: it is a hand-edit to shared kube-system state that a
cluster rebuild silently drops, in exchange for indirection this component does not
need. Rather than half-own the cluster's DNS, the address stays where it was already
declared -- ollama/config.env -- and travels into ollama.url.

No spec.ports: ExternalName ignores them. The port travels in ollama.url instead,
which is also where a scheme change would go.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.ollama.service.name }}
  namespace: {{ include "fathom-agent.namespace" . }}
  labels:
    {{- include "fathom-agent.labels" . | nindent 4 }}
spec:
  type: ExternalName
  externalName: {{ .Values.ollama.service.externalName | quote }}
{{- end }}
