apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fathom-agent.fullname" . }}
  namespace: {{ include "fathom-agent.namespace" . }}
  labels:
    {{- include "fathom-agent.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "fathom-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fathom-agent.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ printf "%s%s%s%s" (toYaml .Values.agent) (toYaml .Values.ollama) (toYaml .Values.mcp) (toYaml .Values.otel) | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "fathom-agent.serviceAccountName" . }}
      # The agent holds no Kubernetes permissions of its own: every cluster read
      # goes through fathom-mcp, whose ServiceAccount carries the RBAC. Mounting a
      # token here would hand the model a second, ungoverned path to the API server.
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: fathom-agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: FATHOM_AGENT_ADDR
              value: ":{{ .Values.service.port }}"
            - name: FATHOM_AGENT_LOG_LEVEL
              value: {{ .Values.agent.logLevel | quote }}
            - name: FATHOM_AGENT_MCP_URL
              value: {{ .Values.mcp.url | quote }}
            - name: FATHOM_AGENT_OLLAMA_URL
              value: {{ .Values.ollama.url | quote }}
            - name: FATHOM_AGENT_MODEL
              value: {{ .Values.ollama.model | quote }}
            - name: FATHOM_AGENT_MAX_ITERATIONS
              value: {{ .Values.agent.maxIterations | quote }}
            - name: FATHOM_AGENT_MAX_TOOL_CHARS
              value: {{ .Values.agent.maxToolChars | quote }}
            - name: FATHOM_AGENT_REQUEST_TIMEOUT
              value: {{ .Values.agent.requestTimeout | quote }}
            - name: FATHOM_AGENT_MCP_TIMEOUT
              value: {{ .Values.agent.mcpTimeout | quote }}
            - name: FATHOM_AGENT_READY_CACHE
              value: {{ .Values.agent.readyCache | quote }}
            - name: FATHOM_AGENT_REMEDIATION
              value: {{ ternary "on" "off" .Values.agent.remediation.enabled | quote }}
            - name: FATHOM_AGENT_REMEDIATION_TIMEOUT
              value: {{ .Values.agent.remediation.timeout | quote }}
            {{- with .Values.agent.systemPrompt }}
            - name: FATHOM_AGENT_SYSTEM_PROMPT
              value: {{ . | quote }}
            {{- end }}
            {{- /*
              Declared before OTEL_RESOURCE_ATTRIBUTES because the kubelet only
              expands $(VAR) references to variables defined earlier in this
              list. The downward API rather than a resource detector: this pod
              runs with automountServiceAccountToken: false and no RBAC, so
              anything that queries the API server for these would come back
              empty.
            */}}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: FATHOM_AGENT_TELEMETRY
              value: {{ .Values.otel.mode | quote }}
            {{- if ne .Values.otel.mode "off" }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"
            - name: OTEL_TRACES_SAMPLER
              value: {{ .Values.otel.sampler | quote }}
            - name: OTEL_METRIC_EXPORT_INTERVAL
              value: {{ .Values.otel.metricExportInterval | quote }}
            - name: OTEL_PROPAGATORS
              value: "tracecontext,baggage"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "k8s.namespace.name=$(POD_NAMESPACE),k8s.pod.name=$(POD_NAME),k8s.node.name=$(NODE_NAME),k8s.deployment.name={{ include "fathom-agent.fullname" . }},service.instance.id=$(POD_NAME),deployment.environment.name={{ .Values.otel.environment }}"
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            # readOnlyRootFilesystem is on, and the interpreter still wants a
            # scratch directory; HOME is pointed here in the image.
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            # Python plus the LangChain import tree takes seconds to become
            # listenable, unlike the Go binary this mirrors.
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
