{{- if .Values.serviceAccount.create }}
{{/*
Created so the pod does not run as the namespace's `default` ServiceAccount, not
because it needs permissions. There is deliberately no Role, ClusterRole or binding
in this chart -- see the note on automountServiceAccountToken in deployment.yaml.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "fathom-agent.serviceAccountName" . }}
  namespace: {{ include "fathom-agent.namespace" . }}
  labels:
    {{- include "fathom-agent.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
