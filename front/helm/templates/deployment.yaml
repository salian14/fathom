apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fathom-front.fullname" . }}
  namespace: {{ include "fathom-front.namespace" . }}
  labels:
    {{- include "fathom-front.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "fathom-front.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fathom-front.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ printf "%s%s%s%s" (toYaml .Values.agent) (toYaml .Values.eval) (toYaml .Values.front) (toYaml .Values.otel) | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "fathom-front.serviceAccountName" . }}
      # This service holds no Kubernetes permissions and needs none: it moves
      # JSON between a browser and fathom-agent. Every cluster read still goes
      # through fathom-mcp, which is the only place the RBAC lives. Mounting a
      # token here would put a credential on the one pod reachable from outside
      # the cluster.
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: fathom-front
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: FATHOM_FRONT_ADDR
              value: ":{{ .Values.service.port }}"
            - name: FATHOM_FRONT_LOG_LEVEL
              value: {{ .Values.front.logLevel | quote }}
            - name: FATHOM_FRONT_AGENT_URL
              value: {{ .Values.agent.url | quote }}
            - name: FATHOM_FRONT_AGENT_TIMEOUT
              value: {{ .Values.agent.timeout | quote }}
            - name: FATHOM_FRONT_READY_TIMEOUT
              value: {{ .Values.agent.readyTimeout | quote }}
            {{- /*
              Empty is meaningful: it is the disabled state for the eval view,
              not a missing value. Set unconditionally so that clearing it in
              values.yaml actually clears it on the pod.
            */}}
            - name: FATHOM_FRONT_EVAL_URL
              value: {{ .Values.eval.url | quote }}
            - name: FATHOM_FRONT_EVAL_TIMEOUT
              value: {{ .Values.eval.timeout | quote }}
            - name: FATHOM_FRONT_MAX_BODY_BYTES
              value: {{ .Values.front.maxBodyBytes | quote }}
            {{- /*
              Declared before OTEL_RESOURCE_ATTRIBUTES because the kubelet only
              expands $(VAR) references to variables defined earlier in this
              list. The downward API rather than a resource detector: this pod
              runs with automountServiceAccountToken: false and no RBAC, so
              anything that queries the API server for these would come back
              empty.
            */}}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: FATHOM_FRONT_TELEMETRY
              value: {{ .Values.otel.mode | quote }}
            {{- if ne .Values.otel.mode "off" }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"
            - name: OTEL_TRACES_SAMPLER
              value: {{ .Values.otel.sampler | quote }}
            - name: OTEL_METRIC_EXPORT_INTERVAL
              value: {{ .Values.otel.metricExportInterval | quote }}
            - name: OTEL_PROPAGATORS
              value: "tracecontext,baggage"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "k8s.namespace.name=$(POD_NAMESPACE),k8s.pod.name=$(POD_NAME),k8s.node.name=$(NODE_NAME),k8s.deployment.name={{ include "fathom-front.fullname" . }},service.instance.id=$(POD_NAME),deployment.environment.name={{ .Values.otel.environment }}"
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- /*
            No volumeMounts. readOnlyRootFilesystem is on, and unlike the agent
            this needs no scratch directory: the UI is embedded in the binary
            and nothing here writes to disk.
          */}}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            # A static Go binary, listenable almost immediately -- the agent's
            # longer delays are its Python import tree, not a shared convention.
            initialDelaySeconds: 3
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            # /readyz here reports the *agent's* readiness, so this pod stays
            # out of the Service until the thing it proxies to can answer.
            # Serving a chat page that cannot reach the agent just moves the
            # failure to forty seconds after the first question.
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
