[project]
name = "fathom-eval"
version = "0.5.4"
description = "Fathom's evaluation harness: stages known-broken workloads, asks the agent about them, and grades the answers deterministically."
requires-python = ">=3.12"

dependencies = [
    # The agent is reached over plain HTTP; the cluster over the official client.
    "httpx==0.28.1",
    "kubernetes==36.0.3",
    "PyYAML==6.0.3",
    # `serve` needs an HTTP server. This was aiohttp until 2026-08-23, chosen because
    # the kubernetes client already pulls it and FastAPI would add starlette, uvicorn
    # and pydantic to a batch image for six read-only routes.
    #
    # Reversed deliberately. That reasoning was right about image weight and wrong about
    # what `serve` is: it is the only pure JSON API in the repo, its responses cross a
    # namespace boundary into front/internal/web/static/evals.js, and aiohttp publishes
    # no machine-readable description of any of it. FastAPI serves its own
    # /openapi.json, which scripts/contracts.py scrapes from a running container exactly
    # as it does for fathom-agent -- so contracts/eval/openapi.json costs this component
    # no describe-myself code, which is the constraint contracts/ is built around. Three
    # wheels is the price of the response contract being generated instead of prose.
    # Pinned to the same versions agent/pyproject.toml carries -- one FastAPI in the repo.
    "fastapi==0.141.1",
    "uvicorn==0.52.3",
    # Telemetry, matching the other components. Traces only -- `run` and `judge` are
    # batch jobs and a metric stream from them means nothing. The FastAPI instrumentation
    # is the one server-shaped piece: `serve` is a long-running inbound boundary, and the
    # repo's rule is to instrument a boundary with the auto instrumentation rather than
    # hand-rolled spans. Same call fathom-agent makes, same excluded_urls.
    "opentelemetry-instrumentation-fastapi==0.65b0",
    "opentelemetry-sdk==1.44.0",
    "opentelemetry-exporter-otlp-proto-grpc==1.44.0",
    "opentelemetry-instrumentation-httpx==0.65b0",
    "opentelemetry-instrumentation-logging==0.65b0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.1",
    "ruff==0.15.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# The fixture YAMLs are data the harness loads at runtime, so they ship inside the
# package rather than beside it -- the image has no repo checkout to read from.
[tool.setuptools.package-data]
fathom_eval = ["fixtures/*.yaml"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# E/F pyflakes+pycodestyle, I import sorting, UP pyupgrade, B bugbear.
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
