{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "fathom-eval.serviceAccountName" . }}
  namespace: {{ include "fathom-eval.namespace" . }}
  labels:
    {{- include "fathom-eval.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- /*
  Unlike fathom-agent, this ServiceAccount's token IS mounted -- the harness cannot
  create fixtures without it. That asymmetry is deliberate and should not be
  "corrected" for consistency: fathom-agent holds no credentials precisely so the model
  cannot reach the API server, while this component is the one thing in the repo whose
  job is to write to the cluster.
*/}}
automountServiceAccountToken: true
{{- end }}
