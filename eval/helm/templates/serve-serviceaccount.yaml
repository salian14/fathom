{{- if and .Values.serve.enabled .Values.serve.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "fathom-eval.serveServiceAccountName" . }}
  namespace: {{ include "fathom-eval.namespace" . }}
  labels:
    {{- include "fathom-eval.serveLabels" . | nindent 4 }}
  {{- with .Values.serve.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- /*
  No token, and no Role, RoleBinding or ClusterRole anywhere -- rbac.yaml is untouched
  by this workload.

  Its own account rather than the harness's, and the asymmetry with serviceaccount.yaml
  beside this file is the point. That one is the only write-capable credential in the
  whole repository: it creates and deletes namespaces, because staging a broken workload
  is what it is for. This one reads a file on a volume. It needs the volume, not the
  cluster.

  Reusing the harness's account "because it is already there" would put namespace-delete
  on the one pod in this namespace that another namespace's Service can reach. Do not.
*/}}
automountServiceAccountToken: false
{{- end }}
